<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluasi Dosen Anonim</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,sans-serif}
        body{background:linear-gradient(135deg,#6366F1 0%,#8B5CF6 100%);min-height:100vh;padding:20px}
        .container{max-width:680px;margin:0 auto}
        header{text-align:center;color:white;margin-bottom:30px}
        .tabs{display:flex;background:white;border-radius:12px;margin-bottom:25px;overflow:hidden}
        .tab{flex:1;padding:15px;text-align:center;cursor:pointer;font-weight:600;color:#6B7280}
        .tab.active{background:#6366F1;color:white}
        .card{background:white;border-radius:16px;padding:30px;margin-bottom:20px}
        .info-box{background:#E0E7FF;border-left:4px solid #6366F1;padding:14px;border-radius:8px;margin-bottom:24px}
        .form-group{margin-bottom:20px}
        label{display:block;margin-bottom:8px;font-weight:600}
        select,textarea{width:100%;padding:12px;border:2px solid #E5E7EB;border-radius:8px;font-size:1rem}
        button{background:linear-gradient(135deg,#6366F1 0%,#7C3AED 100%);color:white;border:none;padding:14px;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer;width:100%}
        .success-msg{background:#D1FAE5;color:#065F46;padding:14px;border-radius:8px;margin-top:16px;display:none;text-align:center}
        .hidden{display:none !important}
        .stats-box{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
        .stat-card{background:#E0E7FF;padding:16px;border-radius:10px;text-align:center}
        .stat-number{font-size:1.4rem;font-weight:700;color:#4338CA}
        .filter-bar{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
        .filter-btn{background:#F3F4F6;border:none;padding:6px 14px;border-radius:20px;cursor:pointer}
        .filter-btn.active{background:#6366F1;color:white}
        .feedback-item{border-left:4px solid #6366F1;padding:16px;margin-bottom:12px;background:#F9FAFB;border-radius:0 8px 8px 0}
        .category{display:inline-block;background:#E0E7FF;color:#4338CA;font-size:0.8rem;padding:3px 10px;border-radius:20px;font-weight:600;margin-bottom:8px}
        .empty-state{text-align:center;padding:40px;color:#9CA3AF}
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📝 Evaluasi Pembelajaran Anonim</h1>
            <p>Suara Anda penting — sepenuhnya anonim</p>
        </header>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('kirim')">✍️ Kirim Masukan</div>
            <div class="tab" onclick="switchTab('lihat')">👁️ Lihat Hasil</div>
        </div>

        <div id="kirim-section" class="card">
            <div class="info-box">🔒 Sepenuhnya Anonim: identitas Anda tidak tersimpan</div>
            <div class="form-group">
                <label>Mata Kuliah</label>
                <select id="matkul"><option value="">-- Pilih --</option>
                <option value="Perpajakan Dasar">Perpajakan Dasar</option>
                <option value="Statistika Deskriptif">Statistika Deskriptif</option>
                <option value="Pendidikan Kewarganegaraan">Pendidikan Kewarganegaraan</option>
                <option value="Bahasa Indonesia">Bahasa Indonesia</option>
                <option value="Lainnya">Lainnya</option></select>
            </div>
            <div class="form-group">
                <label>Nama Dosen</label>
                <select id="dosen"><option value="">-- Pilih --</option>
                <option value="Ibu Aat Sutihat">Ibu Aat Sutihat S.E., M.Ak.</option>
                <option value="Drs. H.Muslim">Drs. H.Muslim M.Pd</option>
                <option value="Dr. Anis Syamsu Rizal">Dr. Anis Syamsu Rizal</option>
                <option value="Dewi Rani Gustiasari">Dewi Rani Gustiasari S.S, M.Hum</option>
                <option value="Lainnya">Lainnya</option></select>
            </div>
            <div class="form-group">
                <label>Jenis Masukan</label>
                <select id="kategori">
                    <option value="🌟 Apresiasi">🌟 Apresiasi</option>
                    <option value="💡 Saran">💡 Saran</option>
                    <option value="📝 Kritik">📝 Kritik</option>
                    <option value="📊 Evaluasi Umum">📊 Evaluasi Umum</option>
                </select>
            </div>
            <div class="form-group">
                <label>Pesan Anda</label>
                <textarea id="pesan" placeholder="Tulis pesan..."></textarea>
            </div>
            <button onclick="kirimMasukan()">✉️ Kirim Sekarang</button>
            <div class="success-msg" id="berhasilPesan">✅ Terima kasih! Pesan terkirim secara anonim.</div>
        </div>

        <div id="lihat-section" class="card hidden">
            <h3 style="margin-bottom:16px">📋 Hasil Evaluasi</h3>
            <div class="stats-box">
                <div class="stat-card"><div class="stat-number" id="totalJumlah">0</div><div>Total</div></div>
                <div class="stat-card"><div class="stat-number" id="apresiasiJumlah">0</div><div>Apresiasi</div></div>
                <div class="stat-card"><div class="stat-number" id="lainJumlah">0</div><div>Lainnya</div></div>
            </div>
            <div class="filter-bar">
                <button class="filter-btn active" onclick="tampilkanSemua()">Semua</button>
                <button class="filter-btn" onclick="tampilkanKategori('🌟 Apresiasi')">Apresiasi</button>
                <button class="filter-btn" onclick="tampilkanKategori('💡 Saran')">Saran</button>
                <button class="filter-btn" onclick="tampilkanKategori('📝 Kritik')">Kritik</button>
            </div>
            <div id="daftarHasil"></div>
        </div>
    </div>

<script>
let aktifFilter = 'semua';

function switchTab(halaman) {
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    event.target.classList.add('active');
    if (halaman==='kirim') {
        document.getElementById('kirim-section').classList.remove('hidden');
        document.getElementById('lihat-section').classList.add('hidden');
    } else {
        document.getElementById('kirim-section').classList.add('hidden');
        document.getElementById('lihat-section').classList.remove('hidden');
        tampilkanHasil();
    }
}

function kirimMasukan() {
    const matkul = document.getElementById('matkul').value;
    const dosen = document.getElementById('dosen').value;
    const kategori = document.getElementById('kategori').value;
    const pesan = document.getElementById('pesan').value.trim();
    if (!matkul||!dosen||!pesan) { alert('Lengkapi formulir!'); return; }
    
    let data = JSON.parse(localStorage.getItem('evalAnonim')||'[]');
    data.unshift({id:Date.now(),matkul,dosen,kategori,pesan,waktu:new Date().toLocaleString('id-ID')});
    localStorage.setItem('evalAnonim', JSON.stringify(data));
    
    document.getElementById('berhasilPesan').style.display='block';
    document.getElementById('matkul').value='';
    document.getElementById('dosen').value='';
    document.getElementById('kategori').value='';
    document.getElementById('pesan').value='';
    setTimeout(()=>document.getElementById('berhasilPesan').style.display='none',3000);
}

function tampilkanHasil() {
    let data = JSON.parse(localStorage.getItem('evalAnonim')||'[]');
    document.getElementById('totalJumlah').textContent = data.length;
    document.getElementById('apresiasiJumlah').textContent = data.filter(d=>d.kategori.includes('Apresiasi')).length;
    document.getElementById('lainJumlah').textContent = data.filter(d=>!d.kategori.includes('Apresiasi')).length;
    renderDaftar(data);
}

function renderDaftar(data) {
    const el = document.getElementById('daftarHasil');
    if (data.length===0) {
        el.innerHTML='<div class="empty-state">Belum ada masukan. Jadilah yang pertama!</div>';
        return;
    }
    el.innerHTML=data.map(d=>`
        <div class="feedback-item">
            <span class="category">${d.kategori}</span>
            <div style="font-weight:600;margin-bottom:4px">📘 ${d.matkul} — ${d.dosen}</div>
            <div style="color:#374151;line-height:1.6">${d.pesan}</div>
            <div style="font-size:0.8rem;color:#9CA3AF;margin-top:8px">🕐 ${d.waktu}</div>
        </div>
    `).join('');
}

function tampilkanSemua() {
    aktifFilter='semua';
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    event.target.classList.add('active');
    tampilkanHasil();
}

function tampilkanKategori(k) {
    aktifFilter=k;
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    event.target.classList.add('active');
    let data = JSON.parse(localStorage.getItem('evalAnonim')||'[]').filter(d=>d.kategori.startsWith(k));
    renderDaftar(data);
}
</script>
</body>
</html>
